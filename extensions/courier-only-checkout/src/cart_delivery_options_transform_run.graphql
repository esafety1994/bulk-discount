query CartDeliveryOptionsTransformRunInput {
  cart {
    buyerIdentity {
      customer {
        isB2B: hasAnyTag(tags: ["B2B"])
      }
    }
    deliveryGroups {
      deliveryAddress {
        provinceCode
      }
      deliveryOptions {
        handle
        title
        deliveryMethodType
      }
    }
  }
}
