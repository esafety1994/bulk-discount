query RunInput {
  cart {
    buyerIdentity {
      isAuthenticated
      purchasingCompany {
        company {
          id
        }
      }
      customer {
        id
        hasAnyTag(tags: ["B2B", "b2b"])
      }
    }
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
        compareAtAmountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        ... on ProductVariant {
          id
          title
          product {
            id
            title
          }
        }
      }
    }
  }
}
