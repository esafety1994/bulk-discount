query RunInput {
  shop {
    b2bTierMap: metafield(namespace: "custom", key: "b2b_tier_map") {
      value
    }
  }
  cart {
    buyerIdentity {
      isAuthenticated
      customer {
        isB2B: hasAnyTag(tags: ["B2B", "b2b"])
        isTrade: hasAnyTag(tags: ["Trade Account", "trade account"])
        isWholesale: hasAnyTag(tags: ["Wholesale Account", "wholesale account"])
      }
    }
    lines {
      id
      quantity
      isAddon: attribute(key: "_is_addon") {
        value
      }
      cost {
        amountPerQuantity {
          amount
        }
        compareAtAmountPerQuantity {
          amount
        }
      }
      merchandise {
        ... on ProductVariant {
          product {
            isFreeFixing: hasAnyTag(tags: ["Asphalt Fixing", "Dynabolt Fixing"])
            tieredDiscounts: metafield(namespace: "custom", key: "tiered_discounts_qty") {
              value
            }
            b2bCategory: metafield(namespace: "custom", key: "b2b_category") {
              value
            }
          }
        }
      }
    }
  }
}
